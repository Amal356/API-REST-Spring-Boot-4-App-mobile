version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: etudiantsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - etudiants-network

  api:
    build: .
    container_name: spring_api
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - etudiants-network

networks:
  etudiants-network:
    driver: bridge