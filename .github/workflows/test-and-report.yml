name: Test and Report to Xray

on:
  push:
    branches: [ main, version-3, version-4 ]
  pull_request:
    branches: [ main, version-3, version-4 ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.7
        options: --privileged
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests with Maven
      run: cd api-spring-boot && mvn verify

    - name: Publish results to Xray
      if: always()
      env:
        XRAY_TOKEN: ${{ secrets.XRAY_TOKEN }}
      run: |
        curl -H "Content-Type: multipart/form-data" \
             -H "Authorization: Bearer $XRAY_TOKEN" \
             -F "file=@api-spring-boot/target/surefire-reports/TEST-*.xml" \
             "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=PROJ"
