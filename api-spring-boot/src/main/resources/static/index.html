<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Étudiants</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Liste des Étudiants</h1>
    <table id="etudiantsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>CIN</th>
                <th>Nom</th>
                <th>Âge</th>
                <th>Département</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        fetch('/api/etudiants-simple')
            .then(res => res.json())
            .then(data => {
                const tbody = document.querySelector('#etudiantsTable tbody');
                data.forEach(etudiant => {
                    const row = `<tr>
                        <td>${etudiant.id}</td>
                        <td>${etudiant.cin}</td>
                        <td>${etudiant.nom}</td>
                        <td>${etudiant.age}</td>
                        <td>${etudiant.departementNom || 'N/A'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                const tbody = document.querySelector('#etudiantsTable tbody');
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Erreur de chargement des données</td></tr>';
            });
    </script>
</body>
</html>
