<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Étudiants - CRUD Complet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .form-section { background: #f9f9f9; padding: 20px; margin-bottom: 30px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions { display: flex; gap: 5px; }
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Gestion des Étudiants - CRUD Complet</h1>
        
        <!-- Messages -->
        <div id="message" class="message hidden"></div>
        
        <!-- Formulaire de création -->
        <div class="form-section">
            <h2>Ajouter un Étudiant</h2>
            <form id="createForm">
                <div class="form-group">
                    <label for="cin">CIN:</label>
                    <input type="text" id="cin" name="cin" required>
                </div>
                <div class="form-group">
                    <label for="nom">Nom:</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="dateNaissance">Date de Naissance:</label>
                    <input type="date" id="dateNaissance" name="dateNaissance" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="anneePremiereInscription">Année Première Inscription:</label>
                    <input type="number" id="anneePremiereInscription" name="anneePremiereInscription" min="2000" max="2030">
                </div>
                <div class="form-group">
                    <label for="departementId">Département:</label>
                    <select id="departementId" name="departementId">
                        <option value="">Aucun</option>
                    </select>
                </div>
                <button type="submit" class="btn-success">Créer l'Étudiant</button>
                <button type="button" class="btn-warning" onclick="resetForm()">Réinitialiser</button>
            </form>
        </div>
        
        <!-- Tableau des étudiants -->
        <h2>Liste des Étudiants</h2>
        <table id="etudiantsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>CIN</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Âge</th>
                    <th>Département</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    <script>
        // Variables globales
        let etudiants = [];
        let departements = [];
        let currentEditId = null;
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadDepartements();
            loadEtudiants();
            
            // Un SEUL gestionnaire d'événement pour le formulaire
            document.getElementById('createForm').addEventListener('submit', handleSubmit);
        });
        
        // Gestionnaire unique pour le formulaire
        async function handleSubmit(event) {
            event.preventDefault();
            
            // Désactiver le bouton pour éviter les doubles clics
            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                if (currentEditId) {
                    await handleUpdate(currentEditId, data);
                } else {
                    await handleCreate(data);
                }
            } finally {
                submitBtn.disabled = false;
            }
        }
        
        // Charger la liste des départements
        async function loadDepartements() {
            try {
                const response = await fetch('/api/departements');
                departements = await response.json();
                
                const select = document.getElementById('departementId');
                select.innerHTML = '<option value="">Aucun</option>';
                departements.forEach(dept => {
                    select.innerHTML += `<option value="${dept.id}">${dept.nom}</option>`;
                });
            } catch (error) {
                console.error('Erreur chargement départements:', error);
            }
        }
        
        // Charger la liste des étudiants
        async function loadEtudiants() {
            try {
                const response = await fetch('/api/etudiants');
                etudiants = await response.json();
                renderTable();
            } catch (error) {
                showMessage('Erreur de chargement des étudiants', 'error');
            }
        }
        
        // Afficher le tableau des étudiants
        function renderTable() {
            const tbody = document.querySelector('#etudiantsTable tbody');
            tbody.innerHTML = '';
            
            if (etudiants.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Aucun étudiant trouvé</td></tr>';
                return;
            }
            
            etudiants.forEach(etudiant => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${etudiant.id}</td>
                    <td>${etudiant.cin}</td>
                    <td>${etudiant.nom}</td>
                    <td>${etudiant.email || 'N/A'}</td>
                    <td>${etudiant.age}</td>
                    <td>${etudiant.departementNom || 'N/A'}</td>
                    <td class="actions">
                        <button class="btn-warning" onclick="editEtudiant(${etudiant.id})">Modifier</button>
                        <button class="btn-danger" onclick="deleteEtudiant(${etudiant.id})">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        // Gérer la création d'étudiant
        async function handleCreate(data) {
            try {
                const response = await fetch('/api/etudiants', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    showMessage('Étudiant créé avec succès!', 'success');
                    resetForm();
                    loadEtudiants();
                } else {
                    const error = await response.text();
                    showMessage('Erreur lors de la création: ' + error, 'error');
                }
            } catch (error) {
                showMessage('Erreur réseau: ' + error.message, 'error');
            }
        }
        
        // Préparer la modification
        function editEtudiant(id) {
            const etudiant = etudiants.find(e => e.id === id);
            if (!etudiant) return;
            
            currentEditId = id;
            
            // Remplir le formulaire
            document.getElementById('cin').value = etudiant.cin;
            document.getElementById('nom').value = etudiant.nom;
            document.getElementById('dateNaissance').value = etudiant.dateNaissance ? etudiant.dateNaissance.split('T')[0] : '';
            document.getElementById('email').value = etudiant.email || '';
            document.getElementById('anneePremiereInscription').value = etudiant.anneePremiereInscription || '';
            document.getElementById('departementId').value = etudiant.departementId || '';
            
            // Modifier le bouton
            const submitBtn = document.querySelector('#createForm button[type="submit"]');
            submitBtn.textContent = 'Mettre à jour';
            submitBtn.className = 'btn-primary';
            
            document.querySelector('.form-section h2').textContent = 'Modifier l\'Étudiant';
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Gérer la mise à jour
        async function handleUpdate(id, data) {
            try {
                const response = await fetch(`/api/etudiants/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (response.ok) {
                    showMessage('Étudiant mis à jour avec succès!', 'success');
                    resetForm();
                    loadEtudiants();
                } else {
                    const error = await response.text();
                    showMessage('Erreur lors de la mise à jour: ' + error, 'error');
                }
            } catch (error) {
                showMessage('Erreur réseau: ' + error.message, 'error');
            }
        }
        
        // Supprimer un étudiant
        async function deleteEtudiant(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cet étudiant?')) return;
            
            try {
                const response = await fetch(`/api/etudiants/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showMessage('Étudiant supprimé avec succès!', 'success');
                    loadEtudiants();
                }
            } catch (error) {
                showMessage('Erreur réseau: ' + error.message, 'error');
            }
        }
        
        // Réinitialiser le formulaire
        function resetForm() {
            currentEditId = null;
            document.getElementById('createForm').reset();
            
            const submitBtn = document.querySelector('#createForm button[type="submit"]');
            submitBtn.textContent = 'Créer l\'Étudiant';
            submitBtn.className = 'btn-success';
            document.querySelector('.form-section h2').textContent = 'Ajouter un Étudiant';
        }
        
        // Afficher un message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => { messageDiv.className = 'message hidden'; }, 5000);
        }
    </script>
</body>
</html>
