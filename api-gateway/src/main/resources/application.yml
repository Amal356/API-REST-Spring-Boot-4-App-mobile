server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: etudiant-service
              uri: lb://ETUDIANTS
              predicates:
                - Path=/api/etudiants/**
            - id: departement-service
              uri: lb://ETUDIANTS
              predicates:
                - Path=/api/departements/**
            - id: grading-service
              uri: lb://GRADING-SERVICE
              predicates:
                - Path=/api/notes/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

