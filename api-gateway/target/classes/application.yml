server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: etudiant-service
          uri: lb://etudiants
          predicates:
            - Path=/api/etudiants/**
        - id: departement-service
          uri: lb://etudiants
          predicates:
            - Path=/api/departements/**
        - id: grading-service
          uri: lb://grading-service
          predicates:
            - Path=/api/notes/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

